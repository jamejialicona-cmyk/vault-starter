name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is in the matrix on purpose: the auditor forces UTF-8 output
        # because the Windows console mangles accents otherwise.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Use Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Test the auditor, controls included
        run: python scripts/test_check_vault.py

      - name: Audit the demo vault
        run: python scripts/check_vault.py examples

      - name: Syntax-check the hook
        shell: bash
        run: bash -n scripts/hook_current_state.sh
